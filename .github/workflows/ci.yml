name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject unresolved merge markers
        run: |
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker
        run: docker info

      - name: Enable Maven Wrapper
        run: chmod +x mvnw

      - name: Run full verification
        run: ./mvnw -B -ntp clean verify

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install console dependencies
        working-directory: console
        run: npm install --no-audit --no-fund

      - name: Build owner console
        working-directory: console
        env:
          TROQUIM_BACKEND_URL: http://localhost:8080
        run: npm run build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7
