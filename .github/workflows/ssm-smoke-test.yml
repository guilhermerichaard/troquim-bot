name: AWS Production Read-Only Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ssm-smoke-test.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: troquim-prod-readonly-check
          aws-region: sa-east-1

      - name: Inspect production through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.PROD_EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          test -n "${INSTANCE_ID}"

          REMOTE_COMMAND="$(cat <<'REMOTE'
          set -eu
          echo "troquim-prod-readonly-ok"
          echo "hostname=$(hostname)"

          docker inspect troquim-bot --format 'backend_image={{.Config.Image}} backend_status={{.State.Status}} backend_health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          docker inspect troquim-console --format 'console_image={{.Config.Image}} console_status={{.State.Status}}' 2>/dev/null || echo "console_container=missing"
          docker inspect troquim-postgres --format 'postgres_image={{.Config.Image}} postgres_status={{.State.Status}}'

          CURRENT_IMAGE="$(docker inspect troquim-bot --format '{{.Config.Image}}')"
          CURRENT_TAG="${CURRENT_IMAGE#troquim-bot:}"
          CURRENT_DROPLET="/opt/troquim/src/troquim-bot/docker-compose.droplet.yml"
          RELEASE_DROPLET="/opt/troquim/releases/${CURRENT_TAG}/docker-compose.droplet.yml"
          if [ -f "${CURRENT_DROPLET}" ] && [ -f "${RELEASE_DROPLET}" ]; then
            echo "current_droplet_sha256=$(sha256sum "${CURRENT_DROPLET}" | awk '{print $1}')"
            echo "release_droplet_sha256=$(sha256sum "${RELEASE_DROPLET}" | awk '{print $1}')"
            if cmp -s "${CURRENT_DROPLET}" "${RELEASE_DROPLET}"; then
              echo "droplet_match=yes"
            else
              echo "droplet_match=no"
              echo "droplet_diff_sanitized:"
              diff -u "${RELEASE_DROPLET}" "${CURRENT_DROPLET}" 2>/dev/null \
                | sed -E '/^[+-].*(PASSWORD|SECRET|TOKEN|KEY|ACCESS|PEPPER|PRIVATE|CREDENTIAL)/Id' \
                | sed -E 's#(https?://)[^/@[:space:]]+@#\1<redacted>@#g' \
                | head -120 || true
            fi
          else
            echo "droplet_hash_check=missing_file"
          fi

          printf 'backend_http='
          curl -fsS http://127.0.0.1:8080/actuator/health || true
          echo

          if curl -fsS http://127.0.0.1:3001/login >/dev/null 2>&1; then
            echo "console_http=ok"
          else
            echo "console_http=failed"
          fi

          PGUSER="$(docker exec troquim-postgres printenv POSTGRES_USER)"
          PGDB="$(docker exec troquim-postgres sh -lc 'printf "%s" "${POSTGRES_DB:-$POSTGRES_USER}"')"

          docker exec troquim-postgres psql -U "${PGUSER}" -d "${PGDB}" -Atc             "select 'flyway=' || version from flyway_schema_history where success=true order by installed_rank desc limit 1;"
          docker exec troquim-postgres psql -U "${PGUSER}" -d "${PGDB}" -Atc             "select 'flyway_failed=' || count(*) from flyway_schema_history where success=false;"

          echo "containers:"
          docker ps --format '{{.Names}}|{{.Image}}|{{.Status}}' | grep '^troquim-' || true

          echo "compose_drift:"
          CURRENT_DROPLET="/opt/troquim/src/troquim-bot/docker-compose.droplet.yml"
          CURRENT_IMAGE="$(docker inspect troquim-bot --format '{{.Config.Image}}')"
          CURRENT_TAG="${CURRENT_IMAGE#troquim-bot:}"
          RELEASE_DROPLET="/opt/troquim/releases/${CURRENT_TAG}/docker-compose.droplet.yml"
          if [ -f "${CURRENT_DROPLET}" ] && [ -f "${RELEASE_DROPLET}" ]; then
            echo "current_droplet_sha=$(sha256sum "${CURRENT_DROPLET}" | awk '{print $1}')"
            echo "release_droplet_sha=$(sha256sum "${RELEASE_DROPLET}" | awk '{print $1}')"
            if cmp -s "${CURRENT_DROPLET}" "${RELEASE_DROPLET}"; then
              echo "droplet_drift=none"
            else
              echo "droplet_drift=present"
              echo "sanitized_diff:"
              diff -U0 "${RELEASE_DROPLET}" "${CURRENT_DROPLET}" 2>/dev/null \
                | sed -E \
                    -e '/(PASSWORD|SECRET|TOKEN|API_KEY|PRIVATE_KEY|CREDENTIAL)/I s/^[-+].*/<redacted-sensitive-line>/' \
                    -e 's/(=)[^ $][^ ]*/=\<redacted\>/g' \
                    -e 's#(https?://)[^/@[:space:]]+@#\1<redacted>@#g' \
                | head -n 120 || true
            fi
          else
            echo "droplet_drift=unverifiable"
          fi
          REMOTE
          )"

          jq -n --arg command "${REMOTE_COMMAND}" '{commands:[$command]}' > /tmp/ssm-parameters.json

          COMMAND_ID="$(
            aws ssm send-command               --region sa-east-1               --instance-ids "${INSTANCE_ID}"               --document-name "AWS-RunShellScript"               --comment "Troquim production read-only inspection"               --parameters file:///tmp/ssm-parameters.json               --query 'Command.CommandId'               --output text
          )"

          STATUS="Pending"
          for _ in $(seq 1 30); do
            STATUS="$(
              aws ssm get-command-invocation                 --region sa-east-1                 --command-id "${COMMAND_ID}"                 --instance-id "${INSTANCE_ID}"                 --query 'Status'                 --output text 2>/dev/null || echo Pending
            )"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 2
          done

          OUTPUT="$(
            aws ssm get-command-invocation               --region sa-east-1               --command-id "${COMMAND_ID}"               --instance-id "${INSTANCE_ID}"               --query 'StandardOutputContent'               --output text 2>/dev/null || true
          )"
          ERROR_OUTPUT="$(
            aws ssm get-command-invocation               --region sa-east-1               --command-id "${COMMAND_ID}"               --instance-id "${INSTANCE_ID}"               --query 'StandardErrorContent'               --output text 2>/dev/null || true
          )"

          echo "status=${STATUS}"
          echo "----- stdout -----"
          printf '%s\n' "${OUTPUT}"
          echo "----- stderr -----"
          printf '%s\n' "${ERROR_OUTPUT}"

          test "${STATUS}" = "Success"
          grep -q "troquim-prod-readonly-ok" <<<"${OUTPUT}"
